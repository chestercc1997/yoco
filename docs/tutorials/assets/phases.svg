<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Noto Sans CJK SC, sans-serif" role="img" aria-label="YOCO：哪些位置需要经过后半部分？">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<rect width="1100" height="100%" rx="18" fill="#f4f7fb"/>
<text x="36" y="42" font-size="25" font-weight="700" fill="#132b46">YOCO：哪些位置需要经过后半部分？</text>
<path d="M310,137.5 L402,137.5" stroke="#64748b" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M310,272.5 L402,272.5" stroke="#64748b" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M310,407.5 L402,407.5" stroke="#64748b" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="90" width="270" height="95" rx="12" fill="#e4efff" stroke="#285ea9"/>
<text x="175.0" y="131.5" text-anchor="middle" font-size="19.0" fill="#285ea9">训练</text>
<text x="175.0" y="157.5" text-anchor="middle" font-size="18.3" fill="#285ea9">全部位置经过 self-decoder</text>
<rect x="410" y="90" width="270" height="95" rx="12" fill="#eee6ff" stroke="#6943a0"/>
<text x="545.0" y="131.5" text-anchor="middle" font-size="17.6" fill="#6943a0">全部位置经过 cross-decoder</text>
<text x="545.0" y="157.5" text-anchor="middle" font-size="19.0" fill="#6943a0">所有位置参与 loss</text>
<rect x="40" y="225" width="270" height="95" rx="12" fill="#def5eb" stroke="#247653"/>
<text x="175.0" y="266.5" text-anchor="middle" font-size="19.0" fill="#247653">Prefill</text>
<text x="175.0" y="292.5" text-anchor="middle" font-size="19.0" fill="#247653">全部 prompt 建立共享 KV</text>
<rect x="410" y="225" width="270" height="95" rx="12" fill="#eee6ff" stroke="#6943a0"/>
<text x="545.0" y="266.5" text-anchor="middle" font-size="19.0" fill="#6943a0">末位置经过 cross-decoder</text>
<text x="545.0" y="292.5" text-anchor="middle" font-size="17.6" fill="#6943a0">取得首个新 token 的 logits</text>
<rect x="40" y="360" width="270" height="95" rx="12" fill="#e4efff" stroke="#285ea9"/>
<text x="175.0" y="401.5" text-anchor="middle" font-size="19.0" fill="#285ea9">Decode</text>
<text x="175.0" y="427.5" text-anchor="middle" font-size="17.1" fill="#285ea9">新 token 经过 self-decoder</text>
<rect x="410" y="360" width="270" height="95" rx="12" fill="#eee6ff" stroke="#6943a0"/>
<text x="545.0" y="401.5" text-anchor="middle" font-size="16.4" fill="#6943a0">新 token 经过 cross-decoder</text>
<text x="545.0" y="427.5" text-anchor="middle" font-size="19.0" fill="#6943a0">更新缓存并预测下一 token</text>
<rect x="790" y="210" width="260" height="125" rx="12" fill="#fff0d9" stroke="#9a6513"/>
<text x="920.0" y="253.5" text-anchor="middle" font-size="19.0" fill="#9a6513">成立条件</text>
<text x="920.0" y="279.5" text-anchor="middle" font-size="19.0" fill="#9a6513">后半部分历史交互</text>
<text x="920.0" y="305.5" text-anchor="middle" font-size="19.0" fill="#9a6513">只依赖共享记忆</text>
<text x="36" y="490" font-size="17" fill="#475569">图示为典型 YOCO 的依赖分析；CED 的逐层局部状态需额外处理。</text>
</svg>