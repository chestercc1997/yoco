<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" font-family="Noto Sans CJK SC, sans-serif" role="img" aria-label="局部路径的依赖范围会随深度扩展">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<rect width="1100" height="100%" rx="18" fill="#f4f7fb"/>
<text x="36" y="42" font-size="25" font-weight="700" fill="#132b46">局部路径的依赖范围会随深度扩展</text>
<path d="M305,135.0 L407,135.0" stroke="#64748b" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M685,135.0 L787,135.0" stroke="#64748b" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M485,315.0 L607,315.0" stroke="#64748b" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="35" y="90" width="270" height="90" rx="12" fill="#e4efff" stroke="#285ea9"/>
<text x="170.0" y="129.0" text-anchor="middle" font-size="19.0" fill="#285ea9">第 1 层：W = 4</text>
<text x="170.0" y="155.0" text-anchor="middle" font-size="19.0" fill="#285ea9">位置 10 可依赖 7—10</text>
<rect x="415" y="90" width="270" height="90" rx="12" fill="#e4efff" stroke="#285ea9"/>
<text x="550.0" y="129.0" text-anchor="middle" font-size="19.0" fill="#285ea9">第 2 层</text>
<text x="550.0" y="155.0" text-anchor="middle" font-size="19.0" fill="#285ea9">位置 10 可间接依赖 4—10</text>
<rect x="795" y="90" width="270" height="90" rx="12" fill="#e4efff" stroke="#285ea9"/>
<text x="930.0" y="129.0" text-anchor="middle" font-size="19.0" fill="#285ea9">第 3 层</text>
<text x="930.0" y="155.0" text-anchor="middle" font-size="19.0" fill="#285ea9">位置 10 可间接依赖 1—10</text>
<rect x="125" y="265" width="360" height="100" rx="12" fill="#fff0d9" stroke="#9a6513"/>
<text x="305.0" y="309.0" text-anchor="middle" font-size="19.0" fill="#9a6513">只重放最后 4 个位置</text>
<text x="305.0" y="335.0" text-anchor="middle" font-size="19.0" fill="#9a6513">保留输入 7—10</text>
<rect x="615" y="265" width="360" height="100" rx="12" fill="#eee6ff" stroke="#6943a0"/>
<text x="795.0" y="309.0" text-anchor="middle" font-size="19.0" fill="#6943a0">左边界的历史被截断</text>
<text x="795.0" y="335.0" text-anchor="middle" font-size="19.0" fill="#6943a0">恢复状态可能近似而非精确</text>
<text x="36" y="400" font-size="17" fill="#475569">纯 SWA 教学示例：理论跨度 1 + D(W−1)；不表示加入全局分支后的总感受野。</text>
</svg>